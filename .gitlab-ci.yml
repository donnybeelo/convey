#
# Convey CI config.
#

include:
 - project: Infrastructure/freedesktop-ci-templates
   file: templates/fedora.yml
   ref: aec7a6ce7bb38902c70641526f6611e27141784a
 - project: 'GNOME/citemplates'
   file: 'flatpak/flatpak_ci_initiative.yml'


variables:
  FDO_UPSTREAM_REPO: donnybeelo/convey

  # ImapDB and other tests that touch the disk are super slow on CI
  # runners like gcc150.osuosl.org that use platter drives still.
  # See Infrastructure/Infrastructure#97.
  TEST_ARGS: -t 10

  # Locale used for unit tests
  TEST_LOCALE: C.UTF-8


stages:
  - prepare
  - build
  - publish


##
# Stage: Prepare
#
# This mostly consists of preparing Docker iamges for re-use the CI
##

# See also https://gitlab.gnome.org/Infrastructure/freedesktop-ci-templates
build.container.fedora@x86_64:
  extends:
  - '.fdo.container-build@fedora'
  - '.fedora.container.common'
  stage: 'prepare'
  variables:
    # no need to pull the whole tree for rebuilding the image
    GIT_STRATEGY: none
    # Expiry sets fdo.expires on the image
    FDO_EXPIRES_AFTER: 8w
    # Convey build dependencies (Fedora packages)
    FDO_DISTRIBUTION_PACKAGES: >-
      appstream
      dbus-daemon
      dconf
      desktop-file-utils
      enchant2-devel
      folks-devel
      gcr-devel
      git
      glib-networking
      glib2-devel
      glibc-langpack-en
      gmime30-devel
      gnome-online-accounts-devel
      gnutls-utils
      gsettings-desktop-schemas
      gstreamer1-devel
      gstreamer1-plugins-bad-free-devel
      gstreamer1-plugins-base-devel
      gtk4-devel
      iso-codes-devel
      itstool
      json-glib-devel
      libadwaita-devel
      libgee-devel
      libicu-devel
      libpeas-devel
      libsecret-devel
      libsoup3-devel
      libstemmer-devel
      libunwind-devel
      libxml2-devel
      libytnef-devel
      meson
      ninja
      pinentry-gnome3
      sqlite-devel
      vala
      webkitgtk6.0-devel
      Xvfb

.fedora.container.common:
  variables:
    # When branching a stable release, change 'main' to the
    # release branch name to ensure that a new image will
    # be created, tailored for the stable branch.
    BRANCH_NAME: 'main'
    CONTAINER_TAG: '2026-09-09.0'
    FEDORA_VERSION: latest
    # Derive FDO variables from this automatically.
    # DO NOT edit, instead change the variables above
    FDO_REPO_SUFFIX: '${BRANCH_NAME}'
    FDO_DISTRIBUTION_TAG: '${CONTAINER_TAG}-fedora-${FEDORA_VERSION}'
    FDO_DISTRIBUTION_VERSION: '${FEDORA_VERSION}'

##
# Stage: Build
#
# This stage actually builds & tests Convey. It does so both in Fedora, and in Flatpak
##

fedora:
  extends:
    - '.fdo.suffixed-image@fedora'
    - '.fedora.container.common'
  stage: build

  variables:
    BUILD_DIR: _build
  script:
    - meson setup --buildtype=debug "$BUILD_DIR"
    - meson compile -C "$BUILD_DIR"
    - xvfb-run -a dbus-run-session -- meson test -v --no-stdsplit -C "$BUILD_DIR" "$TEST_ARGS"
    - meson install -C "$BUILD_DIR"
  artifacts:
    when: 'always'
    paths:
      - '$BUILD_DIR/meson-logs'
    expire_in: 2 days

flatpak:
  stage: build
  variables:
    APP_ID: net.donnybeelo.Convey.Devel
    FLATPAK_MODULE: convey
    MANIFEST_PATH: net.donnybeelo.Convey.Devel.json
    RUNTIME_REPO: 'https://flathub.org/repo/flathub.flatpakrepo'
    CI_FB_ARGS: '--install-deps-from=flathub'
    TEST_RUN_ARGS: $TEST_ARGS
    BUNDLE: convey-dev.flatpak
  extends: .flatpak
  # Keeps XDG_RUNTIME_DIR out of CI_PROJECT_DIR, where its sockets break the
  # flatpak dir source copy.
  script:
    - flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - sed 's#mktemp -p "[^"]*" -d xdg-runtime#mktemp -p "/tmp" -d xdg-runtime#' /usr/lib/citemplates/flatpak-job.sh > /tmp/flatpak-job.sh
    - bash /tmp/flatpak-job.sh


##
# Publishing
##

# The Flatpak repo served at releases.donnybeelo.net is built by GitHub
# Actions in donnybeelo/donnybeelo-releases, because that is where the
# ostree objects are hosted. GitHub cannot watch this GitLab instance, so
# a push to main pokes that workflow and hands it the commit to build.
#
# Needs a GitHub token with the "actions: write" scope, set as the masked
# CI variable GITHUB_DISPATCH_TOKEN.
publish-flatpak:
  stage: publish
  image: alpine:latest
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_DISPATCH_TOKEN'
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl --fail-with-body -sS -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_DISPATCH_TOKEN" \
        https://api.github.com/repos/donnybeelo/donnybeelo-releases/dispatches \
        -d "{\"event_type\":\"publish\",\"client_payload\":{
              \"manifest_ref\":\"$CI_COMMIT_BRANCH\",
              \"app_commit\":\"$CI_COMMIT_SHA\",
              \"label\":\"Convey $CI_COMMIT_SHORT_SHA\"}}"
    - echo "Triggered publish for $CI_COMMIT_SHORT_SHA"
